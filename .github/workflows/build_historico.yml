name: Gerar Histórico de Reuniões

on:
  push:
    paths:
      - '*.html'           # Qualquer HTML novo ou atualizado dispara o build
      - '!historico.html'  # Exceto o próprio histórico

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar historico.html
        run: python build_historico.py

      - name: Commit se houver mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.html
          git diff --cached --quiet || git commit -m "historico: atualizado em $(date +'%d/%m/%Y %H:%M')"
          git push
