name: Gerar Histórico e Deploy

on:
  push:
    paths:
      - '*.html'
      - '!index.html'
      - 'build_historico.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar index.html
        run: python build_historico.py

      - name: Commit index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "index: atualizado em $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M')"
          git push
