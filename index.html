<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lindenberg — Revenue Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red:#C8102E; --red-dark:#8B0C1F; --red-light:#E8374F;
  --red-muted:rgba(200,16,46,0.12); --white:#FFFFFF; --off-white:#FAF8F7;
  --gray-light:#F0EDEC; --gray:#C4B8B5; --gray-dark:#7A6E6C;
  --text:#1A1210; --text-light:#5C4F4D;
  --border:rgba(200,16,46,0.18); --shadow:0 2px 24px rgba(26,18,16,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--off-white);color:var(--text);}
header{background:var(--red);color:white;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.25);}
.header-inner{max-width:1400px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{width:36px;height:36px;background:white;border-radius:4px;display:flex;align-items:center;justify-content:center;}
.brand-logo span{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--red);line-height:1;}
.brand-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:0.04em;color:white;}
.brand-sub{font-size:11px;font-weight:400;opacity:0.7;letter-spacing:0.08em;text-transform:uppercase;color:white;}
.period-toggle{display:flex;background:rgba(255,255,255,0.15);border-radius:8px;padding:3px;gap:2px;}
.period-btn{padding:6px 16px;border:none;background:transparent;color:rgba(255,255,255,0.75);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.period-btn:hover{color:white;background:rgba(255,255,255,0.12);}
.period-btn.active{background:white;color:var(--red);font-weight:600;}
nav{background:white;border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:99;box-shadow:0 2px 8px rgba(26,18,16,0.06);}
nav::-webkit-scrollbar{display:none;}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 32px;display:flex;gap:0;flex-wrap:wrap;}
.nav-btn{padding:14px 20px;border:none;background:transparent;color:var(--text-light);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all 0.2s;}
.nav-btn:hover{color:var(--red);}
.nav-btn.active{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
main{max-width:1400px;margin:0 auto;padding:32px;}
.section{display:none;}
.section.active{display:block;}
.section-header{margin-bottom:28px;padding-bottom:18px;border-bottom:2px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.section-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:12px;}
.tag{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;background:var(--red);color:white;padding:3px 10px;border-radius:4px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px;}

.kpi-funnel-row{display:flex;gap:20px;align-items:flex-start;margin-bottom:28px;}
.kpi-grid-left{flex:0 0 70%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:0;}
.funnel-card{flex:0 0 calc(30% - 20px);background:white;border-radius:14px;padding:22px 18px;box-shadow:var(--shadow);min-width:220px;overflow:hidden;}
.funnel-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;letter-spacing:0.01em;}
.funnel-wrap{display:flex;flex-direction:column;gap:2px;width:100%;}
.funnel-step{width:100%;margin:3px 0;box-sizing:border-box;transition:padding-right 0.7s ease;}
.funnel-bar-inner{border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:60px;width:100%;}
.fbar-leads{padding-right:0;}
.fbar-leads .funnel-bar-inner{background:var(--red);}
.fbar-visitas .funnel-bar-inner{background:rgba(140,8,22,0.78);}
.fbar-vendas .funnel-bar-inner{background:rgba(80,3,10,0.88);}
.funnel-num{color:white;font-family:'Playfair Display',serif;font-size:15px;font-weight:700;line-height:1;white-space:nowrap;}
.funnel-lbl{color:rgba(255,255,255,0.9);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap;}
.funnel-arrow-row{display:flex;align-items:center;gap:8px;padding:2px 0 2px 8px;}
.funnel-rate{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap;}
.funnel-rate-lbl{font-size:10px;color:var(--gray-dark);white-space:nowrap;}
.funnel-conv-row{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.funnel-conv-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--red);}
.funnel-conv-lbl{font-size:10px;color:var(--gray-dark);line-height:1.3;}
@media(max-width:1100px){
  .kpi-funnel-row{flex-direction:column;}
  .kpi-grid-left{flex:1 1 auto;width:100%;grid-template-columns:repeat(3,1fr);}
  .funnel-card{flex:1 1 auto;width:100%;}
}
@media(max-width:600px){
  .kpi-grid-left{grid-template-columns:repeat(2,1fr);}
}


.kpi-card{background:white;border-radius:12px;padding:18px;box-shadow:var(--shadow);border-top:3px solid var(--red);}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-dark);margin-bottom:6px;}
.kpi-value{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);line-height:1;}
.kpi-value.red{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--gray-dark);margin-top:4px;}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:22px;margin-bottom:22px;}
.charts-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;margin-bottom:22px;}
.chart-card{background:white;border-radius:14px;padding:24px;box-shadow:var(--shadow);}
.chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;}
.chart-subtitle{font-size:11px;color:var(--gray-dark);margin-bottom:18px;}
.chart-wrap{position:relative;height:310px;}
.chart-wrap-sm{position:relative;height:270px;}
.produto-divider{display:flex;align-items:center;gap:16px;margin:44px 0 28px;}
.produto-divider-line{flex:1;height:1px;background:var(--border);}
.produto-divider-label{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text);white-space:nowrap;}
.produto-divider-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
/* mobile rules moved to comprehensive block below */

/* SUMMARY TABLE */
.table-section{margin-top:52px;margin-bottom:48px;}
.table-title-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:16px;border-bottom:2px solid var(--border);flex-wrap:wrap;}
.table-section-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);flex:1;}
.table-scroll{overflow-x:auto;border-radius:14px;box-shadow:0 2px 24px rgba(26,18,16,0.08);}
.summary-table{width:100%;border-collapse:separate;border-spacing:0;background:white;border-radius:14px;overflow:hidden;font-size:11.5px;}
.summary-table thead tr{background:var(--red);}
.th-name{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.9);white-space:nowrap;min-width:150px;}
.th-val{padding:10px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.9);white-space:nowrap;}
.th-sticky{position:sticky;left:0;z-index:3;background:var(--red);}
.tr-geral td{background:#FFF5F6;font-weight:700;border-bottom:2px solid var(--red);}
.tr-even td{background:white;}
.tr-odd td{background:#FAFAFA;}
.summary-table tbody tr:hover td{background:rgba(200,16,46,0.05);transition:background 0.15s;}
.summary-table tbody tr:hover td.td-sticky{position:sticky;left:0;z-index:2;box-shadow:2px 0 6px rgba(0,0,0,0.07);}
.td-name{padding:9px 14px;color:var(--text);font-weight:500;white-space:nowrap;border-bottom:1px solid var(--gray-light);font-size:12px;}
.td-val{padding:9px 12px;text-align:right;color:var(--text-light);border-bottom:1px solid var(--gray-light);white-space:nowrap;font-variant-numeric:tabular-nums;}
.tr-geral .td-val{color:var(--red-dark);}
.td-sticky{position:sticky;left:0;z-index:2;box-shadow:2px 0 6px rgba(0,0,0,0.07);}
.tr-even .td-sticky{background:white;}
.tr-odd .td-sticky{background:#FAFAFA;}
.tr-geral .td-sticky{background:#FFF5F6;}
.badge-geral{display:inline-block;background:var(--red);color:white;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
.year-toggle{display:flex;background:rgba(255,255,255,0.15);border-radius:8px;padding:3px;gap:2px;}
.year-btn-header{padding:6px 14px;border:none;background:transparent;color:rgba(255,255,255,0.75);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.year-btn-header:hover{color:white;background:rgba(255,255,255,0.12);}
.year-btn-header.active{background:white !important;color:var(--red) !important;font-weight:600;}

.mobile-section-bar { display: none; }

/* Scroll offset for sticky header + nav */
[id^="anchor_"] {
  scroll-margin-top: 120px;
}

/* ═══════════════════════════════════════════════════
   MOBILE — max-width: 768px
   Desktop code is NOT touched above this block.
   ═══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  /* ── HEADER ─────────────────────────────────── */
  header { position: sticky; top: 0; z-index: 100; }
  .header-inner {
    padding: 0 12px;
    height: auto;
    min-height: 52px;
    flex-wrap: nowrap;
    gap: 8px;
  }
  .brand-name { font-size: 16px; }
  .brand-sub { display: none; }
  .brand-logo { width: 28px; height: 28px; }
  .brand-logo span { font-size: 14px; }

  /* Year + Period toggles: stack them compactly */
  .header-inner > div:last-child {
    display: flex !important;
    flex-direction: column !important;
    gap: 4px !important;
    align-items: flex-end !important;
    flex-wrap: nowrap !important;
  }
  .year-toggle {
    padding: 2px;
    gap: 1px;
  }
  .year-btn-header {
    padding: 4px 8px !important;
    font-size: 11px !important;
  }
  .period-toggle { padding: 2px; gap: 1px; }
  .period-btn { padding: 4px 8px; font-size: 11px; }

  /* ── MOBILE SECTION BAR (current section indicator) ── */
  .mobile-section-bar {
    display: block;
    background: rgba(0,0,0,0.25);
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  #mobileSectionName { color: white; }

  /* ── NAV BAR: hidden on mobile ──────────────── */
  nav { display: none !important; }

  /* ── MAIN CONTENT ───────────────────────────── */
  main { padding: 14px 12px; }

  /* Scroll offset on mobile — header is taller */
  [id^="anchor_"] { scroll-margin-top: 140px; }

  /* ── SECTION HEADER ─────────────────────────── */
  .section-header { margin-bottom: 16px; padding-bottom: 12px; }
  .section-title { font-size: 18px; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 9px; padding: 2px 7px; }

  /* ── KPI + FUNNEL ROW: stack vertically ─────── */
  .kpi-funnel-row { flex-direction: column; gap: 14px; margin-bottom: 16px; }
  .kpi-grid-left {
    flex: 1 1 auto;
    width: 100%;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .funnel-card {
    flex: 1 1 auto;
    width: 100%;
    min-width: unset;
    padding: 16px 14px;
  }
  .kpi-card { padding: 10px 8px; border-radius: 8px; }
  .kpi-value { font-size: 15px; }
  .kpi-label { font-size: 9px; letter-spacing: 0.04em; }
  .kpi-sub { font-size: 9px; margin-top: 2px; }

  /* ── CHARTS: single column ───────────────────── */
  .charts-grid,
  .charts-grid-2 { grid-template-columns: 1fr !important; gap: 14px; margin-bottom: 14px; }
  .chart-card { padding: 16px 12px; border-radius: 12px; }
  .chart-title { font-size: 13px; }
  .chart-subtitle { font-size: 10px; margin-bottom: 12px; }
  .chart-wrap { height: 230px; }
  .chart-wrap-sm { height: 190px; }

  /* ── PRODUCT DIVIDER ─────────────────────────── */
  .produto-divider { margin: 32px 0 18px; }
  .produto-divider-label { font-size: 16px; }

  /* ── SUMMARY TABLE ───────────────────────────── */
  .table-section { margin-top: 32px; margin-bottom: 32px; }
  .table-section-title { font-size: 18px; }
  .table-title-row { margin-bottom: 12px; padding-bottom: 12px; }

  /* Table scroll container — allow horizontal swipe */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 10px;
  }
  .summary-table { font-size: 10.5px; }
  .th-name { padding: 8px 10px; font-size: 9px; min-width: 120px; }
  .th-val  { padding: 8px 8px;  font-size: 9px; }
  .td-name { padding: 8px 10px; font-size: 11px; min-width: 120px; }
  .td-val  { padding: 8px 8px; }

  /* Sticky first column on mobile — ensure it has explicit bg */
  .td-sticky, .th-sticky {
    position: sticky !important;
    left: 0 !important;
    z-index: 3 !important;
  }
  .th-sticky { background: var(--red) !important; z-index: 4 !important; }
  .tr-even .td-sticky  { background: white !important; }
  .tr-odd  .td-sticky  { background: #FAFAFA !important; }
  .tr-geral .td-sticky { background: #FFF5F6 !important; }
  /* Shadow to show it's sticky */
  .td-sticky::after, .th-sticky::after {
    content: '';
    position: absolute;
    top: 0; right: -6px;
    width: 6px; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.06), transparent);
    pointer-events: none;
  }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo"><span>L</span></div>
      <div>
        <div class="brand-name">Lindenberg</div>
        <div class="brand-sub">Revenue Board</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="year-toggle" style="background:rgba(255,255,255,0.15);">
        <button class="year-btn year-btn-header" id="hbtn_0" onclick="setGlobalYear(0,this)">Todos</button>
        <button class="year-btn year-btn-header" id="hbtn_2024" onclick="setGlobalYear(2024,this)">2024</button>
        <button class="year-btn year-btn-header" id="hbtn_2025" onclick="setGlobalYear(2025,this)">2025</button>
        <button class="year-btn year-btn-header active" id="hbtn_2026" onclick="setGlobalYear(2026,this)">2026</button>
      </div>
      <div class="period-toggle">
        <button class="period-btn active" id="btn_mensal" onclick="setPeriod('mensal')">Mensal</button>
        <button class="period-btn" id="btn_trimestral" onclick="setPeriod('trimestral')">Trimestral</button>
        <button class="period-btn" id="btn_semestral" onclick="setPeriod('semestral')">Semestral</button>
      </div>
    </div>
  </div>
<div class="mobile-section-bar" id="mobileSectionBar"><span id="mobileSectionName">Visão Geral</span></div></header>
<nav>
  <div class="nav-inner" id="navInner">
    <button class="nav-btn active" id="navbtn_geral" onclick="scrollToSection('geral',this)">Geral</button>
  </div>
</nav>
<main id="mainContent"></main>

// VENDAS EXTERNAS — Vendas de empreendimentos externos geradas pelos nossos leads
// Somam ao VGV e Vendas do GERAL, mas NÃO aos empreendimentos individuais.
//
// Para adicionar novos registros, copie o formato abaixo:
// { ano: AAAA, mes: 'NomeDoMes', vendas: N, vgv: VALOR, descricao: 'Texto livre' }
// ═══════════════════════════════════════════════════════════════════════════
const EXTERNAL_SALES = [
  { ano: 2025, mes: 'Janeiro',  vendas: 1, vgv: 3490000.80,  descricao: 'Empreendimento externo via leads' },
  { ano: 2025, mes: 'Março',    vendas: 1, vgv: 15000000.00, descricao: 'Empreendimento externo via leads' },
];
// ═══════════════════════════════════════════════════════════════════════════

const MES_ORDER = {Janeiro:1,Fevereiro:2,Março:3,Abril:4,Maio:5,Junho:6,Julho:7,Agosto:8,Setembro:9,Outubro:10,Novembro:11,Dezembro:12};
let currentPeriod = 'mensal';
let globalYear = 2026;
let charts = {};

const CR = '#C8102E';
const CT = '#1D6A72';
const CA = '#C97825';
const CD = '#1A1210';

function getProducts() {
  return [...new Set(DATA.map(d => d.produto).filter(p => p && p !== 'Geral'))].sort();
}

function getGeralRows(yearFilter) {
  // Build synthetic geral by summing all product rows per ano+mes
  var map = {};
  DATA.forEach(function(r) {
    if (!r.produto || r.produto === 'Geral') return;
    if (yearFilter && r.ano !== yearFilter) return;
    var key = r.ano + '_' + r.mes;
    if (!map[key]) map[key] = {ano:r.ano, mes:r.mes, produto:'Geral', midia_paga:0, leads:0, cpl:0, visitas:0, vendas:0, vgv:0, vgv_externo:0};
    map[key].midia_paga += r.midia_paga;
    map[key].leads      += r.leads;
    map[key].visitas    += r.visitas;
    map[key].vendas     += r.vendas;
    map[key].vgv        += r.vgv;
  });
  // Add external sales (VGV + vendas only, no midia/leads cost)
  EXTERNAL_SALES.forEach(function(s) {
    if (yearFilter && s.ano !== yearFilter) return;
    var key = s.ano + '_' + s.mes;
    if (!map[key]) map[key] = {ano:s.ano, mes:s.mes, produto:'Geral', midia_paga:0, leads:0, cpl:0, visitas:0, vendas:0, vgv:0, vgv_externo:0};
    map[key].vendas      += s.vendas;
    map[key].vgv         += s.vgv;
    map[key].vgv_externo += s.vgv;
  });
  // recalculate cpl from sums
  Object.values(map).forEach(function(r){ r.cpl = r.leads>0 ? r.midia_paga/r.leads : 0; });
  return Object.values(map);
}

function getRows(produto) {
  return DATA.filter(d => d.produto === produto);
}

function sortMonthly(rows) {
  return [...rows].sort((a,b) => a.ano !== b.ano ? a.ano-b.ano : MES_ORDER[a.mes]-MES_ORDER[b.mes]);
}

function aggregate(rows, period) {
  const sorted = sortMonthly(rows);
  if (period === 'mensal') {
    return sorted.map(r => ({
      label: r.mes.substring(0,3)+'/'+String(r.ano).slice(2),
      midia: r.midia_paga, leads: r.leads,
      visitas: r.visitas, vendas: r.vendas, vgv: r.vgv,
      vgv_externo: r.vgv_externo || 0
    }));
  }
  const size = period === 'trimestral' ? 3 : 6;
  const buckets = {};
  sorted.forEach(r => {
    const idx = Math.floor((MES_ORDER[r.mes]-1)/size);
    const key = r.ano+'-'+idx;
    if (!buckets[key]) buckets[key] = {ano:r.ano,idx,midia:0,leads:0,visitas:0,vendas:0,vgv:0,vgv_externo:0};
    buckets[key].midia  += r.midia_paga;
    buckets[key].leads  += r.leads;
    buckets[key].visitas+= r.visitas;
    buckets[key].vendas += r.vendas;
    buckets[key].vgv    += r.vgv;
    buckets[key].vgv_externo += (r.vgv_externo || 0);
  });
  const pfx = period === 'trimestral' ? 'T' : 'S';
  return Object.values(buckets)
    .sort((a,b) => a.ano!==b.ano ? a.ano-b.ano : a.idx-b.idx)
    .map(b => ({...b, label: pfx+(b.idx+1)+'/'+String(b.ano).slice(2)}));
}

function withMetrics(agg) {
  return agg.map(a => ({
    ...a,
    vgv_externo: a.vgv_externo||0,
    cpl:    a.leads>0   ? a.midia/a.leads   : 0,
    cpv:    a.visitas>0 ? a.midia/a.visitas  : 0,
    cpvenda:a.vendas>0  ? a.midia/a.vendas   : 0,
    lpv:    a.visitas>0 ? a.leads/a.visitas  : 0,
    lpvenda:a.vendas>0  ? a.leads/a.vendas   : 0
  }));
}

function fmt(n) {
  if (!isFinite(n)||isNaN(n)||n===0) return '—';
  return n.toLocaleString('pt-BR',{maximumFractionDigits:1});
}
function fmtBRL(n) {
  if (!isFinite(n)||isNaN(n)||n===0) return '—';
  return 'R$ '+n.toLocaleString('pt-BR',{maximumFractionDigits:0});
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function fmtLabel(v, pfx) {
  if (!v || !isFinite(v) || v === 0) return '';
  if (pfx) return pfx + v.toLocaleString('pt-BR', {maximumFractionDigits:0});
  return v.toLocaleString('pt-BR', {maximumFractionDigits:1});
}

// Shared datalabel base style for BAR datasets
function barDL(color) {
  return {
    display: function(ctx) { return ctx.dataset.data[ctx.dataIndex] > 0; },
    anchor: 'end',
    align: 'end',
    offset: 2,
    color: color || '#1A1210',
    font: { size: 10, weight: '600' },
    formatter: function(v) { return v > 0 ? v.toLocaleString('pt-BR',{maximumFractionDigits:0}) : ''; },
    clamp: true
  };
}

// Shared datalabel for LINE datasets
function lineDL(pfx, color) {
  return {
    display: function(ctx) {
      // Show every other label on dense datasets to avoid overlap
      var data = ctx.dataset.data;
      var n = data.length;
      if (n <= 8) return data[ctx.dataIndex] > 0;
      if (n <= 16) return ctx.dataIndex % 2 === 0 && data[ctx.dataIndex] > 0;
      return ctx.dataIndex % 3 === 0 && data[ctx.dataIndex] > 0;
    },
    anchor: 'top',
    align: 'top',
    offset: 4,
    color: color || '#1A1210',
    font: { size: 10, weight: '600' },
    formatter: function(v) {
      if (!v || !isFinite(v) || v === 0) return '';
      if (pfx) return pfx + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
      return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
    },
    clamp: true,
    backgroundColor: function(ctx) {
      return ctx.dataset.data[ctx.dataIndex] > 0 ? 'rgba(255,255,255,0.85)' : 'transparent';
    },
    borderRadius: 3,
    padding: { top:2, bottom:2, left:4, right:4 }
  };
}

      plugins:{

     borderColor:CR, borderWidth:2.5, pointBackgroundColor:CR,
     pointRadius:4, tension:0.35, yAxisID:'y1', order:1, fill:false,
     datalabels: lineDL('R$ ', CR)},
    {type:'line', label:'VGV Total', data:line2Vals,
     borderColor:CD, borderWidth:2, pointBackgroundColor:CD,
     pointRadius:3, tension:0.35, yAxisID:'y2', order:2, fill:false, borderDash:[5,3],
     datalabels: lineDL('R$ ', CD)}
  ];
  if (hasExt) {
    datasets.push({
      type:'bar', label:'VGV Externo ★', data:extVgvVals,
      backgroundColor:'rgba(0,0,0,0)',
      borderColor:'rgba(0,0,0,0)',
      borderWidth:0, borderRadius:0, yAxisID:'y2', order:4,
      datalabels:{ display: false }
    });
  }
  charts[id] = new Chart(ctx, {
    data:{labels, datasets:datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,position:'top',align:'end',labels:{boxWidth:10,padding:14}},
        datalabels: {},
        tooltip:{backgroundColor:'#1A1210',padding:10,cornerRadius:8,
          callbacks:{label:function(c){
            var v=c.parsed.y;
            if(c.datasetIndex===0) return ' Vendas: '+(v?v.toLocaleString('pt-BR',{maximumFractionDigits:1}):'—');
            return ' '+c.dataset.label+': R$ '+(v?v.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—');
          }}
        }
      },
      scales:{
        x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{maxRotation:45}},
        y:{grid:{color:'rgba(0,0,0,0.04)'},position:'left'},
        y1:{grid:{display:false},position:'right',
          ticks:{callback:function(v){return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});}}},
        y2:{display:false}
      }
    }
  });
}

function renderBlock(prefix, rows) {
  const agg = withMetrics(aggregate(rows, currentPeriod));
  if (!agg.length) return;
  const labels = agg.map(function(a){return a.label;});

  comboChart(prefix+'_c1', labels,
    agg.map(function(a){return a.leads;}),
    agg.map(function(a){return a.cpl;}),
    'Leads', 'CPL', 'rgba(200,16,46,0.18)', CR, 'R$ ');

  comboChart(prefix+'_c2', labels,
    agg.map(function(a){return a.visitas;}),
    agg.map(function(a){return a.cpv;}),
    'Visitas', 'Custo/Visita', 'rgba(29,106,114,0.18)', CT, 'R$ ');

  tripleChart(prefix+'_c3', labels,
    agg.map(function(a){return a.vendas;}),
    agg.map(function(a){return a.cpvenda;}),
    agg.map(function(a){return a.vgv;}),
    agg.map(function(a){return a.vgv_externo||0;}));

  barChart(prefix+'_c4', labels,
    agg.map(function(a){return a.lpvenda;}),
    'Leads/Venda', CR);

  barChart(prefix+'_c5', labels,
    agg.map(function(a){return a.lpv;}),
    'Leads/Visita', CT);

  // Chart c6: Investment + cumulative line
  (function(){
    var invVals = agg.map(function(a){return a.midia;});
    var cumVals = [];
    var acc = 0;
    invVals.forEach(function(v){ acc+=v; cumVals.push(acc); });
    destroyChart(prefix+'_c6');
    var ctx6 = document.getElementById(prefix+'_c6');
    if(!ctx6) return;
    charts[prefix+'_c6'] = new Chart(ctx6, {
      data:{
        labels: labels,
        datasets:[
          {type:'bar', label:'Investimento', data:invVals,
           backgroundColor:'rgba(200,16,46,0.18)', borderColor:CR,
           borderWidth:1.5, borderRadius:4, yAxisID:'y', order:2,
           datalabels:{
             display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},
             anchor:'end',align:'end',offset:2,color:'#5C4F4D',
             font:{size:9,weight:'600'},
             formatter:function(v){return v>0?'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0}):'';},
             clamp:true
           }
          },
          {type:'line', label:'Acumulado', data:cumVals,
           borderColor:CA, borderWidth:2.5, pointBackgroundColor:CA,
           pointRadius:4, tension:0.35, yAxisID:'y1', order:1, fill:false,
           datalabels: lineDL('R$ ', CA)
          }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:true,position:'top',align:'end',labels:{boxWidth:10,padding:14}},
          datalabels:{},
          tooltip:{backgroundColor:'#1A1210',padding:10,cornerRadius:8,
            callbacks:{label:function(c){
              var v=c.parsed.y;
              return ' '+c.dataset.label+': R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
            }}
          }
        },
        scales:{
          x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{maxRotation:45}},
          y:{grid:{color:'rgba(0,0,0,0.04)'},position:'left',
             ticks:{callback:function(v){return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});}}},
          y1:{grid:{display:false},position:'right',min:0,
             ticks:{callback:function(v){return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});}}}
        }
      }
    });
  })();

  // Update KPIs totals (always mensal to accumulate everything)
  var all = withMetrics(aggregate(rows, 'mensal'));
  var tL=0,tV=0,tVd=0,tVGV=0,tM=0;
  all.forEach(function(a){tL+=a.leads;tV+=a.visitas;tVd+=a.vendas;tVGV+=a.vgv;tM+=a.midia;});
  function set(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}
  set(prefix+'_k1', tL.toLocaleString('pt-BR',{maximumFractionDigits:0}));
  set(prefix+'_k2', tV.toLocaleString('pt-BR',{maximumFractionDigits:0}));
  set(prefix+'_k3', tVd.toLocaleString('pt-BR',{maximumFractionDigits:0}));
  set(prefix+'_k4', tVGV>0?'R$ '+tVGV.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—');
  set(prefix+'_k5', tL>0?'R$ '+(tM/tL).toLocaleString('pt-BR',{maximumFractionDigits:0}):'—');
  set(prefix+'_k6', tVd>0?fmt(tL/tVd)+'x':'—');
  set(prefix+'_k7', tV>0?fmt(tL/tV)+'x':'—');
  set(prefix+'_k8', tM>0?'R$ '+tM.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—');
  set(prefix+'_k9', tVGV>0?(tM/tVGV*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'—');

  // Funnel
  var pLV  = tL>0  ? (tV/tL*100)   : 0;
  var pVVd = tV>0  ? (tVd/tV*100)  : 0;
  var pLVd = tL>0  ? (tVd/tL*100)  : 0;
  // Width: visitas bar = 50% of leads max, vendas bar = 75% of visitas max
  // So visitas width (relative to leads) capped at 50%, vendas capped at 50%*75%=37.5%
  var wV  = tL>0 ? Math.min(100, Math.max(20, (tV/tL)*100)) : 0;
  var wVd = tV>0 ? Math.min(100, Math.max(10, (tVd/tV)*100)) : 0;
  // Scale: visitas max display = 50% of card, vendas max = 75% of visitas display
  var wVdisp  = Math.max(20, Math.min(50, wV * 0.5));
  var wVddisp = Math.max(10, Math.min(wVdisp * 0.75, wVdisp * (wVd/100)));
  set(prefix+'_fn1', tL.toLocaleString('pt-BR'));
  set(prefix+'_fn2', tV.toLocaleString('pt-BR'));
  set(prefix+'_fn3', tVd.toLocaleString('pt-BR'));
  set(prefix+'_fr1', pLV.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%');
  set(prefix+'_fr2', pVVd.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%');
  set(prefix+'_fconv', pLVd.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%');
  // Apply widths as right-padding to create funnel shape (bar-inner fills from left)
  var fb2 = document.getElementById(prefix+'_fb2');
  var fb3 = document.getElementById(prefix+'_fb3');
  var fs2 = fb2 ? fb2.parentElement : null;
  var fs3 = fb3 ? fb3.parentElement : null;
  if(fs2) fs2.style.paddingRight = (100 - wVdisp)+'%';
  if(fs3) fs3.style.paddingRight = (100 - wVddisp)+'%';
}

  return '<div class="section-header"><div class="section-title">'+title+' '+tagHTML+'</div></div>'
  +'<div class="kpi-funnel-row">'
  +'<div class="kpi-grid kpi-grid-left">'
  +'<div class="kpi-card"><div class="kpi-label">Total Leads</div><div class="kpi-value" id="'+prefix+'_k1">...</div><div class="kpi-sub">Período completo</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Visitas</div><div class="kpi-value" id="'+prefix+'_k2">...</div><div class="kpi-sub">Período completo</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Vendas</div><div class="kpi-value red" id="'+prefix+'_k3">...</div><div class="kpi-sub">Período completo</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">VGV Total</div><div class="kpi-value" id="'+prefix+'_k4">...</div><div class="kpi-sub">R$ total</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">CPL Médio</div><div class="kpi-value red" id="'+prefix+'_k5">...</div><div class="kpi-sub">R$ por lead</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Leads / Venda</div><div class="kpi-value" id="'+prefix+'_k6">...</div><div class="kpi-sub">Eficiência</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Leads / Visita</div><div class="kpi-value" id="'+prefix+'_k7">...</div><div class="kpi-sub">Conversão</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Mídia Paga</div><div class="kpi-value" id="'+prefix+'_k8">...</div><div class="kpi-sub">R$ total</div></div>'
  +'<div class="kpi-card"><div class="kpi-label">Budget / VGV</div><div class="kpi-value red" id="'+prefix+'_k9">...</div><div class="kpi-sub">Quanto menor, melhor</div></div>'
  +'</div>'
  +'<div class="funnel-card">'
  +'<div class="funnel-title">Funil de Conversão</div>'
  +'<div class="funnel-wrap">'
  +'<div class="funnel-step fbar-leads"><div class="funnel-bar-inner"><span class="funnel-num" id="'+prefix+'_fn1">—</span><span class="funnel-lbl">Leads</span></div></div>'
  +'<div class="funnel-arrow-row"><span class="funnel-rate" id="'+prefix+'_fr1">—</span><span class="funnel-rate-lbl">Lead → Visita</span></div>'
  +'<div class="funnel-step fbar-visitas"><div class="funnel-bar-inner" id="'+prefix+'_fb2"><span class="funnel-num" id="'+prefix+'_fn2">—</span><span class="funnel-lbl">Visitas</span></div></div>'
  +'<div class="funnel-arrow-row"><span class="funnel-rate" id="'+prefix+'_fr2">—</span><span class="funnel-rate-lbl">Visita → Venda</span></div>'
  +'<div class="funnel-step fbar-vendas"><div class="funnel-bar-inner" id="'+prefix+'_fb3"><span class="funnel-num" id="'+prefix+'_fn3">—</span><span class="funnel-lbl">Vendas</span></div></div>'
  +'<div class="funnel-conv-row"><span class="funnel-conv-num" id="'+prefix+'_fconv">—</span><span class="funnel-conv-lbl">Conversão total Lead → Venda</span></div>'
  +'</div>'
  +'</div>'
  +'</div>'
  +'<div class="charts-grid">'
  +'<div class="chart-card"><div class="chart-title">Volume de Leads &amp; CPL</div><div class="chart-subtitle">Barras = Leads | Linha = Custo por Lead (R$)</div><div class="chart-wrap"><canvas id="'+prefix+'_c1"></canvas></div></div>'
  +'<div class="chart-card"><div class="chart-title">Visitas &amp; Custo por Visita</div><div class="chart-subtitle">Barras = Visitas | Linha = Custo por Visita (R$)</div><div class="chart-wrap"><canvas id="'+prefix+'_c2"></canvas></div></div>'
  +'</div>'
  +'<div class="charts-grid" style="grid-template-columns:1fr;">'
  +'<div class="chart-card"><div class="chart-title">Vendas, Custo por Venda &amp; VGV</div><div class="chart-subtitle">Barras = Vendas | Linha vermelha = Custo/Venda | Linha tracejada = VGV (R$)</div><div class="chart-wrap"><canvas id="'+prefix+'_c3"></canvas></div></div>'
  +'</div>'
  +'<div class="charts-grid" style="grid-template-columns:1fr;">'

  +'<div class="chart-card"><div class="chart-title">Leads necessários por Visita</div><div class="chart-subtitle">Qtd. de leads para cada visita realizada</div><div class="chart-wrap-sm"><canvas id="'+prefix+'_c5"></canvas></div></div>'

function filterByYear(rows) {
  return globalYear===0 ? rows : rows.filter(function(r){return r.ano===globalYear;});
}

function renderAll() {
  renderBlock('geral', filterByYear(getGeralRows()));
  getProducts().forEach(function(p) {
    var prefix = 'p_'+p.replace(/[^a-zA-Z0-9]/g,'_');
    renderBlock(prefix, filterByYear(DATA.filter(function(d){return d.produto===p;})));
  });
}

function setGlobalYear(year, btn) {
  globalYear = year;
  document.querySelectorAll('.year-btn-header').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderAll();
  buildSummaryTable();
  setTimeout(function(){
    document.querySelectorAll('.year-btn-header').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  }, 200);
}


function setPeriod(p) {
  currentPeriod = p;
  ['mensal','trimestral','semestral'].forEach(function(x){
    document.getElementById('btn_'+x).classList.toggle('active', x===p);
  });
  renderAll();
}

function scrollToSection(id, btn) {
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var el = document.getElementById('anchor_'+id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

(function init() {
  var products = getProducts();
  var nav = document.getElementById('navInner');
  var main = document.getElementById('mainContent');

  // Build HTML
  var html = '<div id="anchor_geral" style="padding-top:1px"></div>';
  html += blockHTML('geral', 'Visao Geral', true);

  products.forEach(function(p) {
    var prefix = 'p_'+p.replace(/[^a-zA-Z0-9]/g,'_');
    var safeId = p.replace(/[^a-zA-Z0-9]/g,'_');
    html += '<div id="anchor_'+safeId+'" class="produto-divider">'
           +'<div class="produto-divider-line"></div>'
           +'<div class="produto-divider-dot"></div>'
           +'<div class="produto-divider-label">'+p+'</div>'
           +'<div class="produto-divider-dot"></div>'
           +'<div class="produto-divider-line"></div>'
           +'</div>';
    html += blockHTML(prefix, p, false);

    // Nav button
    var btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = p;
    btn.setAttribute('id', 'navbtn_'+safeId);
    (function(pid, safeId){ 
      btn.onclick = function(){ scrollToSection(safeId, this); };
    })(p, safeId);
    nav.appendChild(btn);
  });

  main.innerHTML = html;
  setTimeout(function() { renderAll(); buildSummaryTable(); }, 100);
})();

// ── SCROLL SPY ──────────────────────────────────────────────────────────────
(function() {
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() {
      ticking = false;
      var navHeight = 64 + (document.querySelector('nav') ? document.querySelector('nav').offsetHeight : 46);
      var anchors = document.querySelectorAll('[id^="anchor_"]');
      var current = null;
      anchors.forEach(function(el) {
        var rect = el.getBoundingClientRect();
        if (rect.top <= navHeight + 30) current = el.id.replace('anchor_', '');
      });
      if (current) {
        document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
        var activeBtn = document.getElementById('navbtn_' + current);
        if (!activeBtn && current === 'geral') activeBtn = document.querySelector('.nav-btn');
        if (activeBtn) {
          activeBtn.classList.add('active');
        }
        // Update mobile section bar
        var mbar = document.getElementById('mobileSectionName');
        if (mbar) {
          var label = 'Visão Geral';
          if (current !== 'geral') {
            // Try nav button text first
            var navBtn = document.getElementById('navbtn_' + current);
            if (navBtn) {
              label = navBtn.textContent;
            } else {
              // Fallback: find the produto-divider-label for this anchor
              var divLabel = document.querySelector('#anchor_' + current + ' .produto-divider-label');
              if (divLabel) label = divLabel.textContent;
              else label = current.replace(/_/g, ' ');
            }
          }
          mbar.textContent = label;
        }
      }
    });
  }
  window.addEventListener('scroll', onScroll, {passive: true});
})();


function buildSummaryTable() {
  var products = getProducts();

  function calcRow(rows) {
    var filtered = globalYear===0 ? rows : rows.filter(function(r){return r.ano===globalYear;});
    var all = withMetrics(aggregate(filtered, 'mensal'));
    var tL=0,tV=0,tVd=0,tVGV=0,tM=0;
    all.forEach(function(a){tL+=a.leads;tV+=a.visitas;tVd+=a.vendas;tVGV+=a.vgv;tM+=a.midia;});
    return {
      leads:tL, visitas:tV, vendas:tVd, vgv:tVGV, midia:tM,
      cpl:     tL>0  ? tM/tL   : 0,
      cpv:     tV>0  ? tM/tV   : 0,
      cpvenda: tVd>0 ? tM/tVd  : 0,
      lpvenda: tVd>0 ? tL/tVd  : 0,
      lpvisita:tV>0  ? tL/tV   : 0,
      budgetvgv:tVGV>0 ? tM/tVGV*100 : 0
    };
  }

  function n(v,d){return v>0?v.toLocaleString('pt-BR',{maximumFractionDigits:d||0}):'—';}
  function brl(v){return v>0?'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0}):'—';}
  function xfmt(v){return v>0?v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'x':'—';}
  function bvgv(v){return v>0?v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'—';}

  var cols = [
    {label:'Empreendimento',   key:'nome'},
    {label:'Mídia Paga',       key:'midia',     fmt:brl},
    {label:'Leads',            key:'leads',     fmt:function(v){return n(v);}},
    {label:'CPL',              key:'cpl',       fmt:brl},
    {label:'Visitas',          key:'visitas',   fmt:function(v){return n(v);}},
    {label:'Cst/Visita',       key:'cpv',       fmt:brl},
    {label:'Vendas',           key:'vendas',    fmt:function(v){return n(v);}},
    {label:'Cst/Venda',        key:'cpvenda',   fmt:brl},
    {label:'VGV',              key:'vgv',       fmt:brl},
    {label:'Lds/Venda',        key:'lpvenda',   fmt:xfmt},
    {label:'Lds/Visita',       key:'lpvisita',  fmt:xfmt},
    {label:'Bdg/VGV',          key:'budgetvgv', fmt:bvgv}
  ];

  function makeRow(nome, data, isGeral, isEven) {
    var rc = isGeral ? 'tr-geral' : (isEven ? 'tr-even' : 'tr-odd');
    var nameCell = isGeral
      ? '<td class="td-name td-sticky"><span class="badge-geral">Consolidado</span></td>'
      : '<td class="td-name td-sticky">'+nome+'</td>';
    var cells = cols.slice(1).map(function(col){
      return '<td class="td-val">'+col.fmt(data[col.key])+'</td>';
    }).join('');
    return '<tr class="'+rc+'">'+nameCell+cells+'</tr>';
  }

  var geralRow = calcRow(getGeralRows());
  var tbody = makeRow('Geral', geralRow, true, false);
  products.forEach(function(p,i){
    var r = calcRow(DATA.filter(function(d){return d.produto===p;}));
    if (r.leads>0||r.visitas>0||r.vendas>0)
      tbody += makeRow(p, r, false, i%2===0);
  });

  var thead = cols.map(function(col,i){
    return '<th class="'+(i===0?'th-name th-sticky':'th-val')+'">'+col.label+'</th>';
  }).join('');

  var html = '<div class="table-section">'
    +'<div class="table-title-row">'
    +'<span class="table-section-title">Resumo Consolidado</span>'
    +'</div>'
    +'<div class="table-scroll">'
    +'<table class="summary-table"><thead><tr>'+thead+'</tr></thead><tbody id="summaryTbody">'+tbody+'</tbody></table>'
    +'</div></div>';

  var el = document.getElementById('summaryTable');
  if (!el) { el = document.createElement('div'); el.id='summaryTable'; document.getElementById('mainContent').appendChild(el); }
  el.innerHTML = html;
}



</script>
